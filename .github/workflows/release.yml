---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# One release per tag; never cancel a release that is mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      id-token: write # OIDC token for keyless cosign/Sigstore signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser authenticates via GITHUB_TOKEN, not the persisted git credential.
          persist-credentials: false

      # Go (from go.mod), goreleaser, cosign and syft at the versions in mise.toml,
      # so the release is built with the toolchain a local snapshot uses.
      - name: Set up tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # mise itself. Unset, every tag would run whatever release is newest,
          # holding this job's write token and signing identity. Renovate bumps
          # it as the jdx/mise dependency.
          version: 2026.10.19
          # A restored tool cache is trusted as-is; release builds must not trust
          # a cache poisonable from lower-privilege runs.
          cache: false

      - name: Run GoReleaser
        run: mise run release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
