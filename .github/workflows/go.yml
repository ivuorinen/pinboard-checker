name: Go test build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: neither job writes anything back to the repository. Without
# this block the workflow inherits the repository default, which may grant
# write access across contents, issues, and packages.
permissions:
  contents: read

# A new push to a PR supersedes the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Installs the tools in mise.toml; Go comes from go.mod's toolchain line. The
    # default cache key hashes only mise's own files, and an exact hit is never
    # re-saved, so go.mod joins the key or a toolchain bump is downloaded forever.
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        # mise itself; unset, each run installs the newest release. Renovate
        # bumps it as the jdx/mise dependency.
        version: 2026.10.19
        cache_key: "{{default}}-${{ hashFiles('go.mod') }}"

    # mise-action caches only mise's directory, not Go's build and module caches.
    # go.mod is in the key for the reason above: a toolchain bump needs a new
    # key, or the stale cache keeps being restored and is never re-saved.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build
      run: mise run build

    # Tests under -race plus the 100% gate. The suite covers every statement, so
    # a drop means a new branch arrived untested; failing on it is the point.
    - name: Test and coverage gate
      run: mise run coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: 2026.10.19
        cache_key: "{{default}}-${{ hashFiles('go.mod') }}"

    # .editorconfig, the shell scripts, and the workflows: the conventions
    # golangci-lint does not see.
    - name: Check conventions
      run: mise run check

    # install-mode: none runs the golangci-lint mise installed, so its version
    # lives only in mise.toml; the action still annotates PRs and caches analysis.
    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        install-mode: none
        # --fix=false overrides `issues.fix: true` in .golangci.yml. Without it
        # CI would rewrite the checkout and then lint its own output.
        args: --fix=false
