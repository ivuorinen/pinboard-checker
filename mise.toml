# Tools and tasks for this repository. CI installs the same tools with
# jdx/mise-action, runs the build, coverage and check tasks, and lints with
# golangci-lint-action on the same golangci-lint (without auto-fix).
#
# Go is not pinned here: mise reads the `toolchain` line in go.mod (see
# [settings]), the same line Go's own toolchain switching follows, so go.mod is
# the only place the Go version lives.

[tools]
golangci-lint = "2.15.0"
goreleaser = "2.18.3"
# goreleaser shells out to these in the release workflow: `signs.cmd: cosign`
# and the `sboms` block (syft).
cosign = "3.1.4"
syft = "1.55.0"
# The `check` task: the repo's conventions golangci-lint does not cover.
editorconfig-checker = "4.0.2"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.31.1"

[settings]
# Take the Go version from go.mod. mise reads `toolchain goX.Y.Z` as an exact
# version; only a patch-less `go X.Y` directive is deprecated as a source.
idiomatic_version_file_enable_tools = ["go"]

[tasks.format]
description = "Format Go code"
run = "gofmt -s -w ."

[tasks.lint]
description = "Lint Go code, applying golangci-lint's auto-fixes"
run = "golangci-lint run"

# Each of these has let a defect reach the tree before it ran in CI: line-length
# violations in the workflows, a shellcheck warning in gen-notices.sh (which
# runs at tag time with the release job's write token), and zizmor findings.
[tasks.check]
description = "Check .editorconfig, the shell scripts, and the workflows"
run = [
  "editorconfig-checker",
  "shellcheck scripts/*.sh",
  "actionlint",
  "zizmor --pedantic .",
]

# -race is not optional: the whole program is a worker pool sharing one mutable
# Statistics, so a race introduced there must fail.
[tasks.test]
description = "Run all tests under the race detector"
run = "go test -race ./..."

# Blocks marked `// coverage:ignore` are excluded; see the script.
[tasks.coverage]
description = "Run tests with coverage; fail below 100% and write coverage.html"
run = [
  "go test -race -coverprofile=coverage.out ./...",
  "./scripts/coverage-gate.sh coverage.out 100",
  "go tool cover -html=coverage.out -o coverage.html",
]

[tasks.build]
description = "Build the binary"
run = "go build -o pinboard-checker ."

# --skip=sign: keyless cosign outside CI opens a browser login and records the
# signer's email in the public Rekor log, for an artifact nobody downloads.
[tasks.release]
description = "Build a snapshot release into dist/ (no publish, no signing)"
run = "goreleaser release --clean --snapshot --skip=sign"

[tasks.release-publish]
description = "Publish a release; run by the release workflow (needs GITHUB_TOKEN, OIDC)"
run = "goreleaser release --clean"

[tasks.tidy]
description = "Update Go modules"
run = "go mod tidy"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf pinboard-checker dist/ coverage.out coverage.html THIRD_PARTY_NOTICES.md"
